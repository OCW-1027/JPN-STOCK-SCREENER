name: Daily Screener

on:
  schedule:
    - cron: '3,18,33,48 0-6 * * 1-5'    # 일본·한국 장중 (09:03~15:48 JST/KST)
    - cron: '33 7 * * 1-5'              # 일본·한국 종가판 (16:33) → history·프로필 저장
    - cron: '3,18,33,48 13-20 * * 1-5'  # 미국 장중 (한국시간 밤 22:03~다음날 05:48)
    - cron: '33 21 * * 1-5'             # 미국 종가판 (한국시간 아침 06:33) → history·프로필 저장
  repository_dispatch:
    types: [tick]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: History target 결정 (종가 후 첫 실행 1회만 저장)
        run: |
          # 종가 이후 시간대 전체를 창으로 잡되, 그 날짜 파일이 이미 있으면 건너뛴다.
          #   일본·한국: 16:30~17:59 JST / 미국: 06:30~07:59 JST
          # → GitHub 큐 지연으로 실행이 밀려도 그날 안에 반드시 한 번은 저장됨.
          H=$(TZ=Asia/Tokyo date +%H); M=$(TZ=Asia/Tokyo date +%M)
          D=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          WANT=""
          if { [ "$H" = "16" ] && [ "$M" -ge 30 ]; } || [ "$H" = "17" ]; then WANT="jp,kr"; fi
          if { [ "$H" = "06" ] && [ "$M" -ge 30 ]; } || [ "$H" = "07" ]; then WANT="us"; fi
          HM=""
          for m in $(echo "$WANT" | tr ',' ' '); do
            if [ -f "history/$m/$D.csv.gz" ]; then
              echo "  [$m] $D 이미 저장됨 → 건너뜀"
            else
              HM="${HM:+$HM,}$m"
            fi
          done
          echo "HM=$HM" >> $GITHUB_ENV
          echo "JST ${H}:${M} | 대상 '${WANT}' → 저장 '${HM}'"

      - name: 장중 거래량 곡선 기록 (RVOL 보정용, 실패해도 계속)
        continue-on-error: true
        run: python volcurve.py

      - name: Run screener (JP + KR + US)
        run: python screener.py
        env:
          OUTPUT_DIR: site
          HISTORY_MARKETS: ${{ env.HM }}

      - name: 시그널 성과 백테스트 (실패해도 계속)
        continue-on-error: true
        run: python backtest.py
        env:
          OUTPUT_DIR: site

      - name: 거래대금 순위 추이 (실패해도 계속)
        continue-on-error: true
        run: python ranking.py
        env:
          OUTPUT_DIR: site

      - name: 운용 데스크 브리프 페이지 (실패해도 계속)
        continue-on-error: true
        run: python brief.py page
        env:
          OUTPUT_DIR: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: gh-pages 브랜치로 결과물 푸시 (Cloudflare Pages용)
        continue-on-error: true
        run: |
          # site/ 내용을 gh-pages 브랜치에 통째로 덮어쓴다.
          # 이력을 남기지 않는 단일 커밋(orphan)이라 리포가 무거워지지 않는다.
          # 실패해도 위의 GitHub Pages 배포는 이미 끝난 상태이므로 서비스에 영향 없음.
          cd site
          touch .nojekyll
          git init -q
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "site $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "gh-pages 푸시 완료 ($(du -sh . | cut -f1))"

      - name: Commit history & volcurve (종가판만)
        if: env.HM != ''
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add history/ volcurve/
          git commit -m "data $(TZ=Asia/Tokyo date +'%Y-%m-%d') ($HM)" || echo "no changes"
          git push
