name: Daily Screener

on:
  schedule:
    - cron: '3,18,33,48 0-6 * * 1-5'    # 일본·한국 장중 (09:03~15:48 JST/KST)
    - cron: '33 7 * * 1-5'              # 일본·한국 종가판 (16:33) → history·프로필 저장
    - cron: '3,18,33,48 13-20 * * 1-5'  # 미국 장중 (한국시간 밤 22:03~다음날 05:48)
    - cron: '33 21 * * 1-5'             # 미국 종가판 (한국시간 아침 06:33) → history·프로필 저장
  repository_dispatch:
    types: [tick]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: History target 결정 (종가판 실행만 저장)
        run: |
          case "${{ github.event.schedule }}" in
            "33 7 * * 1-5")  echo "HM=jp,kr" >> $GITHUB_ENV ;;
            "33 21 * * 1-5") echo "HM=us"    >> $GITHUB_ENV ;;
            "")              echo "HM=jp,kr,us" >> $GITHUB_ENV ;;
            *)               echo "HM="      >> $GITHUB_ENV ;;
          esac

      - name: 회사 프로필 수집 (종가판만, 실패해도 계속)
        if: env.HM != ''
        continue-on-error: true
        run: python profiles.py
        env:
          HISTORY_MARKETS: ${{ env.HM }}
          PROFILE_BATCH: '250'

      - name: Run screener (JP + KR + US)
        run: python screener.py
        env:
          OUTPUT_DIR: site
          HISTORY_MARKETS: ${{ env.HM }}

      - name: 시그널 성과 백테스트 (실패해도 계속)
        continue-on-error: true
        run: python backtest.py
        env:
          OUTPUT_DIR: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit history & profiles (종가판만)
        if: env.HM != ''
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add history/ profiles/
          git commit -m "data $(TZ=Asia/Tokyo date +'%Y-%m-%d') ($HM)" || echo "no changes"
          git push
