name: Daily Screener

on:
  schedule:
    # 장중: 평일 09:00~15:45 JST, 15분 간격 (UTC 00:00~06:45)
    - cron: '*/15 0-6 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run screener
        run: mkdir -p site && python screener.py
        env:
          OUTPUT_HTML: site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit history (16시 이후 실행만)
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -ge 16 ]; then
            git config user.name "screener-bot"
            git config user.email "actions@users.noreply.github.com"
            git add history/
            git commit -m "history $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || echo "no changes"
            git push
          else
            echo "장중 실행 - history 커밋 생략"
          fi
