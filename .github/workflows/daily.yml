name: Daily Screener

on:
  repository_dispatch:          # cron-job.org (주 트리거, 15분 간격)
    types: [tick]
  schedule:                     # 백업: 종가판 2회만 (외부 크론 장애 대비)
    - cron: '38 7 * * 1-5'      # 16:38 JST — 일본·한국 종가
    - cron: '38 21 * * 1-5'     # 06:38 JST — 미국 종가
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: History target 결정 (JST 시각 기준)
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          case "$H" in
            16) echo "HM=jp,kr" >> $GITHUB_ENV ;;
            06) echo "HM=us"    >> $GITHUB_ENV ;;
            *)  echo "HM="      >> $GITHUB_ENV ;;
          esac
          echo "JST ${H}시 실행"

      - name: 회사 프로필 수집 (종가판만, 실패해도 계속)
        if: env.HM != ''
        continue-on-error: true
        run: python profiles.py
        env:
          HISTORY_MARKETS: ${{ env.HM }}
          PROFILE_BATCH: '250'

      - name: Run screener (JP + KR + US)
        run: python screener.py
        env:
          OUTPUT_DIR: site
          HISTORY_MARKETS: ${{ env.HM }}

      - name: 시그널 성과 백테스트 (실패해도 계속)
        continue-on-error: true
        run: python backtest.py
        env:
          OUTPUT_DIR: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit history & profiles (종가판만)
        if: env.HM != ''
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add history/ profiles/
          git commit -m "data $(TZ=Asia/Tokyo date +'%Y-%m-%d') ($HM)" || echo "no changes"
          git push
