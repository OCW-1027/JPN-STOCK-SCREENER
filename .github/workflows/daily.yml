name: Daily Screener

on:
  schedule:
    - cron: '*/15 0-6 * * 1-5'    # 일본·한국 장중 (09:00~15:45 JST/KST, 15분 간격)
    - cron: '30 7 * * 1-5'        # 일본·한국 종가판 (16:30) → jp,kr history 저장
    - cron: '*/15 13-20 * * 1-5'  # 미국 장중 (한국시간 밤 22:00~다음날 05:45)
    - cron: '30 21 * * 1-5'       # 미국 종가판 (한국시간 아침 06:30) → us history 저장
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: History target 결정 (종가판 실행만 저장)
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * 1-5")  echo "HM=jp,kr" >> $GITHUB_ENV ;;
            "30 21 * * 1-5") echo "HM=us"    >> $GITHUB_ENV ;;
            *)               echo "HM="      >> $GITHUB_ENV ;;
          esac

      - name: Run screener (JP + KR + US)
        run: python screener.py
        env:
          OUTPUT_DIR: site
          HISTORY_MARKETS: ${{ env.HM }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit history (종가판만)
        if: env.HM != ''
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/
          git commit -m "history $(TZ=Asia/Tokyo date +'%Y-%m-%d') ($HM)" || echo "no changes"
          git push
