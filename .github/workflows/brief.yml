name: Desk Brief

# 운용 데스크 브리프 — 종가 스냅샷(history/{시장}/날짜.csv.gz)이 커밋된 뒤 시장별 후보 종목을 규칙으로 뽑는다.
# LLM_MODE=off 라 모델 호출·비용 없음. 결과는 briefs/ 에 커밋되고, daily.yml 이 페이지(/brief/ 시장 탭)로 렌더한다.
#   일본·한국: 18:03 JST (재시도 18:33·19:03)  ← 16:33 종가판 스냅샷 이후
#   미국:      08:03 JST (재시도 08:33·09:03)  ← 06:33 종가판 스냅샷 이후 (화~토 아침)
# 스냅샷이 아직 없으면 다음 재시도 시각에 다시 확인하고, 이미 만든 날은 건너뛴다.

on:
  schedule:
    - cron: '3 9 * * 1-5'     # 18:03 JST 월~금 → jp,kr
    - cron: '33 9 * * 1-5'    # 18:33 JST (재시도)
    - cron: '3 10 * * 1-5'    # 19:03 JST (재시도)
    - cron: '3 23 * * 1-5'    # 08:03 JST 화~토 → us  (UTC 월~금 23:03)
    - cron: '33 23 * * 1-5'   # 08:33 JST (재시도)
    - cron: '3 0 * * 2-6'     # 09:03 JST (재시도)
  workflow_dispatch:
    inputs:
      market:
        description: '시장 (jp,kr,us 콤마 구분 — 비우면 전부 시도)'
        required: false
        default: ''
      date:
        description: '스냅샷 날짜 YYYY-MM-DD (비우면 오늘 JST)'
        required: false
        default: ''
      force:
        description: '이미 있어도 다시 생성 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write        # 생성 후 daily.yml 을 workflow_dispatch 로 깨워 페이지를 바로 갱신

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 가드 (시장별로 스냅샷 있음 & 브리프 없음일 때만 진행)
        id: guard
        run: |
          IN="${{ github.event.inputs.market }}"
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          F="${{ github.event.inputs.force || 'false' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${IN:-jp,kr,us}"
          else
            H=$(TZ=Asia/Tokyo date +%H)
            case "$H" in
              18|19) WANT="jp,kr" ;;
              08|09) WANT="us" ;;
              *)     WANT="" ;;
            esac
          fi
          GO=""
          for m in $(echo "$WANT" | tr ',' ' '); do
            if [ ! -f "history/$m/$D.csv.gz" ]; then
              echo "[$m] history/$m/$D.csv.gz 없음 → 건너뜀"; continue
            fi
            if [ -f "briefs/$m/$D.json" ] && [ "$F" != "true" ]; then
              echo "[$m] briefs/$m/$D.json 이미 있음 → 건너뜀"; continue
            fi
            GO="${GO:+$GO }$m"
          done
          echo "GO=$GO" >> $GITHUB_ENV
          echo "D=$D" >> $GITHUB_ENV
          if [ -n "$GO" ]; then echo "go=true" >> $GITHUB_OUTPUT; else echo "go=false" >> $GITHUB_OUTPUT; fi
          echo "JST $(TZ=Asia/Tokyo date +%H:%M) | 대상 '$WANT' → 진행 '$GO' (날짜 $D)"

      - name: 브리프 생성 (시장별 후보 선정 · 공시 · 기저율 · 텔레그램)
        if: steps.guard.outputs.go == 'true'
        run: |
          for m in $GO; do
            echo "::group::[$m] $D"
            MARKET=$m python brief.py
            echo "::endgroup::"
          done
        env:
          BRIEF_DATE: ${{ env.D }}
          LLM_MODE: off                 # 나중에 자동 평가를 켜려면 api 로 바꾸고 ANTHROPIC_API_KEY 시크릿 추가
          MAX_PICKS: '20'
          # 거래대금·시총·주가 하한은 brief.py 의 시장별 기본값(억엔·억원·$M) 사용. 바꾸려면 MIN_VAL / MIN_MCAP / MIN_PRICE 지정
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: briefs 커밋
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add briefs/
          git commit -m "brief $D ($GO)" || echo "no changes"
          git push

      - name: 사이트 재빌드 요청 (daily.yml 을 깨워 brief 페이지 반영)
        if: steps.guard.outputs.go == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml
