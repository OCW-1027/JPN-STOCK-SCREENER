name: Company Profiles

# 회사 소개문(사업내용 상세) 수집 전용.
# 15분마다 도는 daily.yml과 분리해, 장이 모두 끝난 새벽에 하루 한 번만 조용히 돈다.
# 종목당 개별 조회가 필요해 느리지만(250종목 = 요청 500회), 급할 것이 없는 작업이다.

on:
  schedule:
    - cron: '0 19 * * 1-5'      # 04:00 JST (미국장 마감 후, 일본장 개장 전)
  workflow_dispatch:
    inputs:
      markets:
        description: '수집 대상 (예: jp,kr,us / 비우면 전부)'
        required: false
        default: 'jp,kr,us'
      batch:
        description: '시장당 수집 건수'
        required: false
        default: '250'

permissions:
  contents: write

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 회사 프로필 수집
        run: python profiles.py
        env:
          HISTORY_MARKETS: ${{ github.event.inputs.markets || 'jp,kr,us' }}
          PROFILE_BATCH: ${{ github.event.inputs.batch || '250' }}

      - name: profiles 커밋
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add profiles/
          git commit -m "profiles $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || echo "no changes"
          git push
