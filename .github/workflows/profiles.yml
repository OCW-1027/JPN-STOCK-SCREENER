name: Company Profiles

# 회사 소개문(사업내용 상세) 수집 전용.
# 15분마다 도는 daily.yml과 분리해, 장이 모두 끝난 새벽에 하루 한 번만 조용히 돈다.
# 종목당 개별 조회가 필요해 느리지만(250종목 = 요청 500회), 급할 것이 없는 작업이다.

on:
  schedule:
    - cron: '0 19 * * 1-5'      # 04:00 JST (미국장 마감 후, 일본장 개장 전)
  workflow_dispatch:
    inputs:
      markets:
        description: '수집 대상 (예: jp,kr,us / 비우면 전부)'
        required: false
        default: 'jp,kr,us'
      batch:
        description: '시장당 수집 건수'
        required: false
        default: '250'

permissions:
  contents: write

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 회사 프로필 수집
        run: python profiles.py
        env:
          HISTORY_MARKETS: ${{ github.event.inputs.markets || 'jp,kr,us' }}
          PROFILE_BATCH: ${{ github.event.inputs.batch || '250' }}

      - name: profiles 커밋
        run: |
          # 수집에 40분이 걸리는 동안 daily.yml·brief.yml이 여러 번 커밋하므로
          # push가 밀리는 것이 정상. 최대 5회까지 최신 main 위로 다시 얹어 재시도한다.
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profiles/
          git commit -m "profiles $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || { echo "변경 없음"; exit 0; }

          for i in 1 2 3 4 5; do
            git fetch origin main
            # profiles/ 는 이 워크플로만 건드리므로 항상 내 것을 채택
            if git rebase -X ours origin/main; then
              if git push origin HEAD:main; then
                echo "push 성공 (시도 $i)"; exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "push 실패 — 재시도 $i"
            sleep $((i * 10))
          done
          echo "5회 시도 후에도 push 실패"; exit 1
