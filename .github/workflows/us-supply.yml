name: US Supply

# 미국 수급 데이터(FINRA 일별 공매도 + 나스닥 Short Interest) 수집 전용.
# FINRA는 파일 1개로 12,000종목이 한 번에 들어와 빠르지만,
# 나스닥 Short Interest는 종목당 1회 호출이라 상위 300종목만 받는다(약 3분).
# 15분 주기 daily.yml과 분리해 미국장 마감 후 하루 한 번만 돈다.

on:
  schedule:
    - cron: '30 22 * * 2-6'     # 07:30 JST (전일 미국장 마감 후, FINRA 파일 공개 시점 이후)
  workflow_dispatch:
    inputs:
      si_top:
        description: 'Short Interest 수집 종목 수 (0=건너뜀)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: us-supply
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 미국 수급 수집
        run: python supply_us.py
        env:
          US_SI_TOP: ${{ github.event.inputs.si_top || '300' }}

      - name: supply 커밋
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supply/
          git commit -m "us supply $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || { echo "변경 없음"; exit 0; }

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X ours origin/main; then
              if git push origin HEAD:main; then
                echo "push 성공 (시도 $i)"; exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "push 실패 — 재시도 $i"
            sleep $((i * 10))
          done
          echo "5회 시도 후에도 push 실패"; exit 1
