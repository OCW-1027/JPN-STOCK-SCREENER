    ${p.llm.news.map(x=>`<br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.date)} ${esc(x.title)}</a> <span class="fl">${esc(x.source)}</span>`).join('')}</div>`:'';

}
function render(){
  $('#mk').innerHTML=MK.map(m=>`<a href="#${m}" data-m="${m}" class="${m===mkt?'on':''}">${lbl(m)}</a>`).join('<span class="sep">·</span>');
  if(!B||!B.picks||!B.picks.length){$('#app').innerHTML=`<div class="note">${T.empty}</div>`;$('#meta').textContent='';$('#foot').textContent='';return}

  $('#foot').textContent=T.foot.replace('{minval}{unit}',fu(c.MIN_VAL)).replace('{mcap}{unit}',fu(c.MIN_MCAP)).replace('{extra}',extra).replace('{maxind}',c.MAX_PER_INDUSTRY).replace('{cool}',c.COOLDOWN_DAYS);
  const ps=B.picks.filter(p=>tab==='all'||p.bucket===tab);

  <div class="tabs">${T.tabs.map(([k,l])=>`<div class="tab ${k===tab?'on':''}" data-t="${k}">${l}</div>`).join('')}<button class="btn" id="copyall">${T.copy_all}</button></div>

document.addEventListener('click',e=>{

  const mt=e.target.closest('[data-m]');if(mt){e.preventDefault();mkt=mt.dataset.m;B=BB[mkt];tab='all';open=new Set();history.replaceState(null,'','#'+mkt);render();return}
  const t=e.target.closest('.tab');if(t){tab=t.dataset.t;render();return}

});

<script>
(function () {
  var el = document.getElementById('btcNav');
  if (!el) return;
  var prev = null, ws = null, poll = null, tries = 0;

  function show(px) {
    if (!isFinite(px) || px <= 0) return;
    el.textContent = '$' + Math.round(px).toLocaleString('en-US');
    if (prev != null && px !== prev) el.className = px > prev ? 'up' : 'down';
    prev = px;
  }
  function startPoll() {
    if (poll) return;
    poll = setInterval(function () {
      fetch('https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT-SWAP')
        .then(function (r) { return r.json(); })
        .then(function (j) { var d = j.data && j.data[0]; if (d) show(parseFloat(d.last)); })
        .catch(function () {});
    }, 10000);
  }
  function connect() {
    try { ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public'); }
    catch (e) { startPoll(); return; }
    ws.onopen = function () {
      tries = 0;
      ws.send(JSON.stringify({ op: 'subscribe', args: [{ channel: 'tickers', instId: 'BTC-USDT-SWAP' }] }));
    };
    ws.onmessage = function (e) {
      try {
        var m = JSON.parse(e.data);
        if (m.data && m.data[0] && m.data[0].last) show(parseFloat(m.data[0].last));
      } catch (_) {}
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
    ws.onclose = function () {
      ws = null;
      if (poll) return;
      tries++;
      if (tries <= 3) setTimeout(connect, 2000 * tries); else startPoll();
    };
  }
  fetch('https://ocw-1027.github.io/BTC-DESK/btc.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { show(j.price); })
    .catch(function () {});
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (ws) { try { ws.close(); } catch (_) {} ws = null; }
      if (poll) { clearInterval(poll); poll = null; }
    } else if (!ws && !poll) { tries = 0; connect(); }
  });
  connect();
})();
</script>
